AWSTemplateFormatVersion: '2010-09-09'
Transform:
  - AWS::LanguageExtensions
  - AWS::Serverless-2016-10-31
Resources:
  RequestCorsConfigAndAuthorizer:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: Prod
      CorsConfiguration:
        AllowOrigins:
          - '*' # Or '*' for all origins
        AllowHeaders:
          - 'Content-Type'
          - 'Origin'
          - 'Accept'
          - 'X-Amz-Date'
          - 'Authorization'
          - 'X-Api-Key'
          - 'X-Amz-Security-Token'
          - 'Access-Control-Request-Headers'
          - 'Access-Control-Request-Method'
          - 'Referer'
          - 'User-Agent'
          - 'api_key'
        AllowMethods:
          - 'GET'
          - 'POST'
          - 'PUT'
          - 'DELETE'
          - 'PATCH'
          - 'OPTIONS'
        ExposeHeaders:
          - 'Content-Type'
          - 'Content-Range'
          - 'Access-Control-Allow-Origin'
          - 'Access-Control-Allow-Methods'
          - 'Access-Control-Allow-Headers'
          - 'X-Requested-With'
      FailOnWarnings: true
  NotificationAndTemplate:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: notificationandtemplate:rapid-x86_64
      CodeUri: C:\work\java\eclipse-workspace2\AWS-lambda-assessment
      Architectures:
        - x86_64
      Timeout: 120
      MemorySize: 4096
      Events:
        CreateNotification:
          Type: HttpApi 
          Properties:
            Path: /v1/createNotification
            Method: post
            ApiId: !Ref RequestCorsConfigAndAuthorizer
        FindAllNotifications:
          Type: HttpApi
          Properties:
            Path: /v1/all/notifications
            Method: get
            ApiId: !Ref RequestCorsConfigAndAuthorizer
        FindNotificationById:
          Type: HttpApi
          Properties:
            Path: /v1/findByNotificationId/{id}
            Method: get
            ApiId: !Ref RequestCorsConfigAndAuthorizer
        CreateTemplate:
          Type: HttpApi 
          Properties:
            Path: /v1/createTemplate
            Method: post
            ApiId: !Ref RequestCorsConfigAndAuthorizer
        FindAllTemplates:
          Type: HttpApi
          Properties:
            Path: /v1/all/templates
            Method: get
            ApiId: !Ref RequestCorsConfigAndAuthorizer
        FindTemplateById:
          Type: HttpApi
          Properties:
            Path: /v1/findByTemplateId/{id}
            Method: get
            ApiId: !Ref RequestCorsConfigAndAuthorizer
        UpdateTemplate:
          Type: HttpApi
          Properties:
            Path: /v1/updateTemplate
            Method: patch
            ApiId: !Ref RequestCorsConfigAndAuthorizer
        ShutdownHook:
          Type: HttpApi
          Properties:
            Path: /v1/shutdown
            Method: get
            ApiId: !Ref RequestCorsConfigAndAuthorizer
    Metadata:  # <--- Metadata section to help SAM manage container images
      DockerTag: rapid-x86_64
      DockerContext: .  # <--- Points to the directory with your Dockerfile
      Dockerfile: Dockerfile  # <--- Name of the Docker			