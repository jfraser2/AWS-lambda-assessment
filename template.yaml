AWSTemplateFormatVersion: '2010-09-09'
Transform:
  - AWS::LanguageExtensions
  - AWS::Serverless-2016-10-31
Resources:
  RequestLambdaFunctionAuthorizer:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: RequestLambdaAuthorizer
        Authorizers:
          RequestLambdaAuthorizer:
            FunctionPayloadType: REQUEST
            FunctionArn: !GetAtt AuthFunction.Arn
            FunctionInvokeRole: arn:aws:iam::153822065620:role/AllowLambdaFunctionRole
            AuthorizerPayloadFormatVersion: "2.0"
            EnableFunctionDefaultPermissions: true
            EnableSimpleResponses: true
            AuthorizerResultTtlInSeconds: 0 # Turns off Cache unit of measure is seconds 
      CorsConfiguration:
        AllowOrigins:
          - '*' # Or '*' for all origins
        AllowHeaders:
          - 'Content-Type'
          - 'Origin'
          - 'Accept'
          - 'X-Amz-Date'
          - 'Authorization'
          - 'X-Api-Key'
          - 'X-Amz-Security-Token'
          - 'Access-Control-Request-Headers'
          - 'Access-Control-Request-Method'
          - 'Referer'
          - 'User-Agent'
          - 'api_key'
        AllowMethods:
          - 'GET'
          - 'POST'
          - 'OPTIONS'
          - 'PUT'
          - 'DELETE'
          - 'PATCH'
        ExposeHeaders:
          - 'Content-Type'
          - 'Content-Range'
          - 'Access-Control-Allow-Origin'
          - 'Access-Control-Allow-Methods'
          - 'Access-Control-Allow-Headers'
          - 'X-Requested-With'
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: notificationandtemplate:rapid-x86_64
      CodeUri: C:\work\java\eclipse-workspace2\AWS-lambda-assessment
      Role: arn:aws:iam::153822065620:role/AllowLambdaFunctionRole
      Architectures:
        - x86_64
      Timeout: 120
      MemorySize: 4096
      Events:
        CheckAuthorization:
          Type: HttpApi
          Properties:
            Path: /v1/test/authorization
            Method: post
            ApiId: !Ref RequestLambdaFunctionAuthorizer
            Auth:
              Authorizer: NONE
  NotificationAndTemplate:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: notificationandtemplate:rapid-x86_64
      CodeUri: C:\work\java\eclipse-workspace2\AWS-lambda-assessment
      Architectures:
        - x86_64
      Timeout: 120
      MemorySize: 4096
      Events:
        CreateNotificationOptionsEvent: # Explicitly define OPTIONS if needed for specific logic
          Type: HttpApi
          Properties:
            Path: /v1/createNotification
            Method: options
            ApiId: !Ref RequestLambdaFunctionAuthorizer
            Auth:
              Authorizer: NONE
        CreateNotification:
          Type: HttpApi 
          Properties:
            Path: /v1/createNotification
            Method: post
            ApiId: !Ref RequestLambdaFunctionAuthorizer
        FindAllNotifications:
          Type: HttpApi
          Properties:
            Path: /v1/all/notifications
            Method: get
            ApiId: !Ref RequestLambdaFunctionAuthorizer
        FindNotificationById:
          Type: HttpApi
          Properties:
            Path: /v1/findByNotificationId/{id}
            Method: get
            ApiId: !Ref RequestLambdaFunctionAuthorizer
        CreateTemplateOptionsEvent: # Explicitly define OPTIONS if needed for specific logic
          Type: HttpApi
          Properties:
            Path: /v1/createTemplate
            Method: options
            ApiId: !Ref RequestLambdaFunctionAuthorizer
            Auth:
              Authorizer: NONE
        CreateTemplate:
          Type: HttpApi 
          Properties:
            Path: /v1/createTemplate
            Method: post
            ApiId: !Ref RequestLambdaFunctionAuthorizer
        FindAllTemplates:
          Type: HttpApi
          Properties:
            Path: /v1/all/templates
            Method: get
            ApiId: !Ref RequestLambdaFunctionAuthorizer
        FindTemplateById:
          Type: HttpApi
          Properties:
            Path: /v1/findByTemplateId/{id}
            Method: get
            ApiId: !Ref RequestLambdaFunctionAuthorizer
        UpdateTemplateOptionsEvent: # Explicitly define OPTIONS if needed for specific logic
          Type: HttpApi
          Properties:
            Path: /v1/updateTemplate
            Method: options
            ApiId: !Ref RequestLambdaFunctionAuthorizer
            Auth:
              Authorizer: NONE
        UpdateTemplate:
          Type: HttpApi
          Properties:
            Path: /v1/updateTemplate
            Method: patch
            ApiId: !Ref RequestLambdaFunctionAuthorizer
        ShutdownHook:
          Type: HttpApi
          Properties:
            Path: /v1/shutdown
            Method: get
            ApiId: !Ref RequestLambdaFunctionAuthorizer
    Metadata:  # <--- Metadata section to help SAM manage container images
      DockerTag: rapid-x86_64
      DockerContext: .  # <--- Points to the directory with your Dockerfile
      Dockerfile: Dockerfile  # <--- Name of the Docker			